<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronFit Gym – Register</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
  <script src="js/sql-storage-bridge.js"></script>
  <style>
    .register-card {
      background: var(--clr-bg2);
      padding: 40px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      margin: 80px auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .form-group label {display:block;margin-bottom:5px;color:var(--clr-muted);}
    .form-group input, .form-group select {width:100%;padding:12px;background:var(--clr-bg);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--clr-light);}
    .form-group {margin-bottom:20px;}
    .btn-primary {background:var(--clr-primary);color:#fff;border:none;border-radius:6px;padding:12px;width:100%;font-weight:bold;cursor:pointer;}
    .error-msg {color:#ff4d4d;font-size:0.9em;margin-bottom:10px;text-align:center;}
  </style>
</head>
<body>
  <div class="register-card">
    <h2 style="text-align:center;margin-bottom:10px;">Create Your Account</h2>
    <p style="text-align:center;color:var(--clr-muted);margin-bottom:20px;">Register as a gym member. Trainers and admins sign in with credentials provided by the gym.</p>
    <p id="registerErrorMsg" class="error-msg"></p>
    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" name="regName" required />
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="regEmail" required />
      </div>
      <div class="form-group">
        <label for="regMobile">Mobile Number</label>
        <input type="tel" id="regMobile" name="regMobile" required />
      </div>
      <div class="form-group">
        <label for="regUsername">Username / ID</label>
        <input type="text" id="regUsername" name="regUsername" required />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="regPassword" required />
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:15px;">Already have an account? <a href="login.php">Sign In</a></p>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
